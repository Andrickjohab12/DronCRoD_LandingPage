<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cómo funciona DronCRoD</title><desc id="desc">Diagrama de arquitectura de la página y sus conexiones con cámara, procesamiento de video y telemetría del dron.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102c49"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#1677ff"/><stop offset="1" stop-color="#42c8ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11z" fill="#50caff"/></marker><marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11z" fill="#55e0b0"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf4ff}.muted{fill:#9cb5ce}.tiny{font-size:15px;letter-spacing:1.6px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:17px}.card{fill:#122b45;stroke:#2a4a67;stroke-width:2}.pill{fill:#163957;stroke:#315875;stroke-width:1.5}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1450" cy="80" r="260" fill="#1478ff" opacity=".07"/><circle cx="80" cy="900" r="320" fill="#15b9d0" opacity=".06"/>
  <text x="80" y="82" class="tiny" fill="#58ccff">DRONCRoD · ARQUITECTURA DEL PROYECTO</text><text x="80" y="145" font-size="48" font-weight="800">¿Cómo funciona la página?</text><text x="80" y="183" class="body muted">La interfaz reúne video, telemetría y controles en cuatro vistas.</text>
  <!-- main UI -->
  <rect x="535" y="250" width="530" height="480" rx="28" fill="#0c2035" stroke="#4c9fff" stroke-width="2.5" filter="url(#shadow)"/><rect x="535" y="250" width="530" height="78" rx="27" fill="url(#blue)"/><path d="M535 300h530v28H535z" fill="url(#blue)"/><text x="575" y="300" font-size="25" font-weight="800">PÁGINA WEB · Next.js + React</text><text x="575" y="363" class="tiny muted">NAVEGACIÓN PRINCIPAL</text>
  <rect x="575" y="382" width="210" height="64" rx="15" class="pill"/><text x="600" y="421" class="label">01  Monitoreo</text><rect x="815" y="382" width="210" height="64" rx="15" class="pill"/><text x="840" y="421" class="label">02  Comandos</text>
  <rect x="575" y="462" width="210" height="64" rx="15" class="pill"/><text x="600" y="501" class="label">03  Video en vivo</text><rect x="815" y="462" width="210" height="64" rx="15" class="pill"/><text x="840" y="501" class="label">04  Misión</text>
  <path d="M575 558h450" stroke="#294661"/><text x="575" y="594" class="body">• Estado, batería, GPS y datos de vuelo</text><text x="575" y="628" class="body">• Controles y órdenes del dron</text><text x="575" y="662" class="body">• Video servido por Python + mapa de misión</text><text x="575" y="700" class="body muted">La web presenta datos; Python y el dron generan los datos.</text>
  <!-- left sources -->
  <rect x="80" y="290" width="350" height="178" rx="22" class="card" filter="url(#shadow)"/><text x="115" y="335" class="tiny" fill="#55e0b0">FLUJO DE VIDEO</text><text x="115" y="378" class="label">Cámara del dron</text><text x="115" y="411" class="body muted">Cámara → procesamiento Python</text><text x="115" y="442" class="body muted">→ MJPEG en localhost:5000</text>
  <rect x="80" y="535" width="350" height="178" rx="22" class="card" filter="url(#shadow)"/><text x="115" y="580" class="tiny" fill="#55e0b0">FLUJO DE TELEMETRÍA</text><text x="115" y="623" class="label">Dron / Pixhawk</text><text x="115" y="656" class="body muted">MAVLink → puente Python</text><text x="115" y="687" class="body muted">→ WebSocket localhost:8766</text>
  <!-- right endpoints -->
  <rect x="1170" y="290" width="350" height="178" rx="22" class="card" filter="url(#shadow)"/><text x="1205" y="335" class="tiny" fill="#55e0b0">SERVIDOR DE VIDEO</text><text x="1205" y="378" class="label">Python · MJPEG</text><text x="1205" y="411" class="body muted">La vista Video en vivo solicita</text><text x="1205" y="442" class="body muted">/video_feed al pulsar reproducir.</text>
  <rect x="1170" y="535" width="350" height="178" rx="22" class="card" filter="url(#shadow)"/><text x="1205" y="580" class="tiny" fill="#55e0b0">PUENTE DE TELEMETRÍA</text><text x="1205" y="623" class="label">Python · MAVLink</text><text x="1205" y="656" class="body muted">Envía actualizaciones y recibe</text><text x="1205" y="687" class="body muted">comandos con confirmación.</text>
  <path d="M430 380H520" stroke="#50caff" stroke-width="4" marker-end="url(#arrow)"/><text x="442" y="365" class="tiny muted">IMAGEN</text><path d="M535 420H442" stroke="#55e0b0" stroke-width="3" marker-end="url(#arrowGreen)"/><path d="M430 625H520" stroke="#50caff" stroke-width="4" marker-end="url(#arrow)"/><text x="442" y="610" class="tiny muted">ESTADO</text><path d="M535 654H442" stroke="#55e0b0" stroke-width="3" marker-end="url(#arrowGreen)"/><path d="M1065 408H1155" stroke="#50caff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1155 440H1065" stroke="#55e0b0" stroke-width="3" marker-end="url(#arrowGreen)"/><path d="M1065 620H1155" stroke="#50caff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1155 660H1065" stroke="#55e0b0" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="80" y="797" width="1440" height="112" rx="22" fill="#0e253d" stroke="#284964"/><circle cx="125" cy="852" r="15" fill="#4bc8ff"/><text x="155" y="842" class="body"><tspan font-weight="700">Azul:</tspan> video / datos entran a la interfaz</text><circle cx="610" cy="852" r="15" fill="#55e0b0"/><text x="640" y="842" class="body"><tspan font-weight="700">Verde:</tspan> respuesta / comandos hacia los servicios</text><text x="155" y="880" class="body muted">Clima: el navegador obtiene ubicación y consulta OpenWeatherMap.</text><text x="640" y="880" class="body muted">Las vistas cambian dentro de la aplicación sin salir de la página.</text>
  <text x="80" y="956" class="body muted">Mapa del software documentado en el repositorio · DronCRoD</text>
</svg>
